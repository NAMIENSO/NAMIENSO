<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>波円相 | NAMI ENSO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;300;400&family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0e0e12;
  --paper: #f4f1ea;
  --deep: #0a1628;
  --water: #1a3a5c;
  --mist: #7a8fa3;
  --tide: #2a5a8a;
  --accent: #c8a87a;
  --zen0: #6b0000;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Noto Serif JP', serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── 背景の静水紋 ── */
.bg-ripple {
  position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
}
.bg-ripple svg { width: 100%; height: 100%; opacity: 0.04; }

/* ── メインコンテナ ── */
.stage {
  position: relative; z-index: 1;
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  padding: 0 20px;
}

/* ── ヘッダー ── */
.header {
  text-align: center;
  padding: 72px 0 56px;
  opacity: 0; animation: arise 1.4s ease forwards 0.2s;
}

.header-enso {
  width: 64px; height: 64px; margin: 0 auto 28px;
}
.header-enso svg { width: 100%; height: 100%; }

.header h1 {
  font-family: 'Shippori Mincho', serif;
  font-size: 32px; font-weight: 500;
  letter-spacing: 0.35em;
  color: var(--water);
}

.header-sub {
  margin-top: 14px;
  font-size: 11px; letter-spacing: 0.25em;
  color: var(--mist);
  font-weight: 200;
}

/* ── 入力ゾーン ── */
.observe-zone {
  width: 100%; max-width: 600px;
  opacity: 0; animation: arise 1.4s ease forwards 0.6s;
}

.zone-label {
  font-size: 10px; letter-spacing: 0.3em;
  color: var(--mist); text-align: center;
  margin-bottom: 32px;
}
.zone-label::before, .zone-label::after {
  content: '──';
  margin: 0 12px;
  opacity: 0.4;
}

.field-group { margin-bottom: 20px; }

.field-group label {
  display: block;
  font-size: 10px; letter-spacing: 0.2em;
  color: var(--mist); margin-bottom: 8px;
}

textarea, input[type="text"], input[type="number"], input[type="date"], select {
  width: 100%;
  background: rgba(255,255,255,0.5);
  border: none;
  border-bottom: 1px solid rgba(26,58,92,0.2);
  padding: 10px 0;
  font-family: 'Noto Serif JP', serif;
  font-size: 14px; font-weight: 300;
  color: var(--ink);
  transition: border-color 0.4s;
  outline: none;
  border-radius: 0;
  -webkit-appearance: none;
}
textarea { height: 72px; resize: none; line-height: 1.8; }
textarea:focus, input:focus, select:focus {
  border-bottom-color: rgba(26,58,92,0.6);
  background: transparent;
}

.natural-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 0 24px;
}
.natural-row-wide {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 24px;
  margin-top: 20px;
}

/* ── 観測ボタン ── */
.btn-observe {
  display: block; width: 100%;
  margin: 48px 0 0;
  padding: 18px;
  background: var(--water);
  color: var(--paper);
  border: none; cursor: pointer;
  font-family: 'Shippori Mincho', serif;
  font-size: 15px; letter-spacing: 0.4em;
  transition: background 0.3s, letter-spacing 0.4s;
}
.btn-observe:hover { background: var(--tide); letter-spacing: 0.5em; }
.btn-observe:disabled { opacity: 0.5; cursor: not-allowed; letter-spacing: 0.4em; }

.btn-clear {
  display: block; width: 100%; margin-top: 12px;
  padding: 10px; background: transparent;
  color: var(--mist); border: none; cursor: pointer;
  font-family: 'Noto Serif JP', serif;
  font-size: 11px; letter-spacing: 0.2em;
  transition: color 0.3s;
}
.btn-clear:hover { color: var(--water); }

/* ── ローディング ── */
.loading-screen {
  display: none; width: 100%; max-width: 600px;
  text-align: center; padding: 60px 0;
  opacity: 1; transition: opacity 0.8s ease;
}
.loading-screen.show { display: block; }
.loading-screen.fade-out { opacity: 0; }

#loadingCanvas {
  display: block; margin: 0 auto 32px;
  width: 200px; height: 200px;
}

.loading-phase-label {
  font-family: 'Shippori Mincho', serif;
  font-size: 13px; letter-spacing: 0.4em;
  color: var(--water); margin-bottom: 16px;
  min-height: 20px;
  opacity: 0; animation: arise 0.8s ease forwards 0.3s;
}

.loading-words {
  font-size: 11px; letter-spacing: 0.3em;
  color: var(--mist); animation: breathe 2.5s ease-in-out infinite;
}
@keyframes breathe { 0%,100%{opacity:0.3} 50%{opacity:1} }

/* ── 結果画面 ── */
.result-screen {
  display: none; width: 100%; max-width: 600px;
  padding: 0 0 100px;
}
.result-screen.show { display: block; }

.result-divider {
  width: 1px; height: 60px;
  background: linear-gradient(to bottom, transparent, var(--mist), transparent);
  margin: 0 auto 48px;
}

/* 生成円画像エリア */
.enso-display {
  width: 100%; aspect-ratio: 1;
  max-width: 500px; margin: 0 auto 48px;
  position: relative;
  display: flex; align-items: center; justify-content: center;
}
.enso-display img {
  width: 100%; height: 100%;
  object-fit: contain;
  opacity: 0; transition: opacity 1.2s ease;
}
.enso-display img.loaded { opacity: 1; }
.enso-display .generating-placeholder {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; letter-spacing: 0.3em; color: var(--mist);
}

/* フェーズバッジ */
.phase-badge {
  text-align: center; margin-bottom: 32px;
}
.phase-name {
  display: inline-block;
  font-family: 'Shippori Mincho', serif;
  font-size: 20px; letter-spacing: 0.3em;
  color: var(--water);
  border-bottom: 1px solid rgba(26,58,92,0.2);
  padding-bottom: 8px;
}

/* 観測ログ */
.obs-log {
  font-size: 11px; letter-spacing: 0.2em;
  color: var(--mist); text-align: center;
  margin-bottom: 40px; line-height: 2;
}

/* 詩的本文 */
.result-body {
  font-size: 15px; line-height: 2.4; font-weight: 300;
  color: var(--ink); white-space: pre-wrap;
  margin-bottom: 48px;
  padding: 0 8px;
  border-left: 1px solid rgba(26,58,92,0.12);
  padding-left: 20px;
}

/* ZENパラメータ */
.params-area { margin-bottom: 48px; }
.params-title {
  font-size: 9px; letter-spacing: 0.3em;
  color: var(--mist); text-align: center; margin-bottom: 20px;
}
.params-grid {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px;
}
.param-item { text-align: center; }
.param-key {
  font-size: 8px; letter-spacing: 0.1em;
  color: var(--mist); display: block; margin-bottom: 8px;
}
.param-track {
  height: 48px; background: rgba(26,58,92,0.06);
  position: relative; overflow: hidden;
}
.param-fill {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: var(--water); opacity: 0.5;
  transition: height 1.2s cubic-bezier(0.4, 0, 0.2, 1);
}
.param-val {
  font-size: 10px; color: var(--water);
  display: block; margin-top: 6px;
}

/* アクションエリア */
.actions {
  display: flex; flex-direction: column; gap: 12px;
  margin-bottom: 48px;
}
.btn-primary {
  padding: 16px; background: var(--water); color: var(--paper);
  border: none; cursor: pointer;
  font-family: 'Shippori Mincho', serif;
  font-size: 14px; letter-spacing: 0.3em;
  transition: background 0.3s;
}
.btn-primary:hover { background: var(--tide); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-secondary {
  padding: 14px; background: transparent;
  color: var(--mist); border: 1px solid rgba(26,58,92,0.2);
  cursor: pointer;
  font-family: 'Noto Serif JP', serif;
  font-size: 12px; letter-spacing: 0.2em;
  transition: all 0.3s;
}
.btn-secondary:hover { color: var(--water); border-color: rgba(26,58,92,0.4); }

.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* X共有プレビュー */
.share-text-area {
  background: rgba(255,255,255,0.4);
  border: 1px solid rgba(26,58,92,0.12);
  padding: 16px 20px;
  font-size: 12px; line-height: 2; color: var(--water);
  margin-bottom: 12px;
  white-space: pre-wrap;
  display: none;
}

/* image prompt（折りたたみ） */
.prompt-detail {
  border-top: 1px solid rgba(26,58,92,0.08);
  padding-top: 24px; margin-top: 8px;
}
.prompt-toggle {
  font-size: 10px; letter-spacing: 0.2em; color: var(--mist);
  background: none; border: none; cursor: pointer;
  display: block; width: 100%; text-align: center; padding: 8px;
  transition: color 0.3s;
}
.prompt-toggle:hover { color: var(--water); }
.prompt-content {
  display: none; font-size: 11px; color: var(--mist);
  line-height: 1.8; word-break: break-all;
  padding: 16px 0; border-top: 1px solid rgba(26,58,92,0.06);
}

/* ZEN0 */
.zen0-display {
  font-family: 'Courier New', monospace;
  font-size: 12px; color: var(--zen0);
  text-align: center; padding: 40px;
  border: 1px solid rgba(107,0,0,0.15);
  line-height: 2; letter-spacing: 0.1em;
}

/* エラー */
.error-msg {
  display: none; padding: 16px; text-align: center;
  font-size: 12px; letter-spacing: 0.15em;
  color: var(--zen0); border: 1px solid rgba(107,0,0,0.15);
  margin-top: 24px;
}
.error-msg.show { display: block; }

/* フッター */
.site-footer {
  text-align: center; padding: 40px 0 60px;
  opacity: 0; animation: arise 1.4s ease forwards 1.2s;
}
.site-footer p {
  font-size: 10px; letter-spacing: 0.2em;
  color: var(--mist); line-height: 2.4;
}
.site-footer a {
  color: var(--mist); text-decoration: none;
  border-bottom: 1px solid rgba(122,143,163,0.3);
  transition: color 0.3s;
}
.site-footer a:hover { color: var(--water); }

@keyframes arise {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 480px) {
  .natural-row { grid-template-columns: 1fr 1fr; }
  .natural-row-wide { grid-template-columns: 1fr; }
  .params-grid { gap: 6px; }
  .param-key { font-size: 7px; }
}
</style>
</head>
<body>

<div class="bg-ripple">
  <svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <circle cx="600" cy="400" r="300" fill="none" stroke="#1a3a5c" stroke-width="1">
      <animate attributeName="r" values="300;320;300" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="400" r="200" fill="none" stroke="#1a3a5c" stroke-width="0.5">
      <animate attributeName="r" values="200;215;200" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="400" r="420" fill="none" stroke="#1a3a5c" stroke-width="0.5">
      <animate attributeName="r" values="420;440;420" dur="13s" repeatCount="indefinite"/>
    </circle>
  </svg>
</div>

<div class="stage">

  <!-- ヘッダー -->
  <header class="header">
    <div class="header-enso">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 12 C74 12, 90 30, 90 50 C90 72, 72 90, 50 90 C28 90, 10 72, 10 50 C10 33, 20 18, 34 13"
          stroke="#1a3a5c" stroke-width="4.5" stroke-linecap="round" fill="none"
          stroke-dasharray="260" stroke-dashoffset="260">
          <animate attributeName="stroke-dashoffset" from="260" to="0" dur="2.2s" fill="freeze" begin="0.4s"/>
        </path>
      </svg>
    </div>
    <h1>波円相</h1>
    <p class="header-sub">N A M I &nbsp; E N S O &nbsp;&nbsp;—&nbsp;&nbsp; ENGINE v1.6.1</p>
  </header>

  <!-- 入力ゾーン -->
  <div class="observe-zone" id="inputZone">
    <p class="zone-label">今日の材料を、言葉にしてください</p>

    <div class="field-group">
      <label>今日あったこと</label>
      <textarea id="event" placeholder="断片でも可"></textarea>
    </div>

    <div class="field-group">
      <label>今の気分</label>
      <textarea id="mood" placeholder="一語でも"></textarea>
    </div>

    <div class="field-group">
      <label>頭の中のテーマ（任意）</label>
      <input type="text" id="theme" placeholder="気になっていること">
    </div>

    <div class="natural-row">
      <div class="field-group">
        <label>潮汐（任意）</label>
        <select id="tide">
          <option value="">—</option>
          <option value="大潮">大潮</option>
          <option value="中潮">中潮</option>
          <option value="小潮">小潮</option>
          <option value="長潮">長潮</option>
          <option value="若潮">若潮</option>
        </select>
      </div>
      <div class="field-group">
        <label>天候（任意）</label>
        <input type="text" id="weather" placeholder="快晴・曇りのち晴れ・雨…">
      </div>
      <div class="field-group">
        <label>日付（任意）</label>
        <input type="date" id="date">
      </div>
    </div>

    <div class="natural-row-wide">
      <div class="field-group">
        <label>気温℃（任意）</label>
        <input type="number" id="temperature" placeholder="例：23.4" step="0.1">
      </div>
      <div class="field-group">
        <label>風速m/s（任意）</label>
        <input type="number" id="windspeed" placeholder="例：2.5" step="0.1">
      </div>
    </div>

    <button class="btn-observe" id="observeBtn" onclick="startObservation()">
      今日の波円相を観測する
    </button>
    <button class="btn-clear" onclick="clearAll()">入力をクリア</button>

    <div class="error-msg" id="errorMsg"></div>
  </div>

  <!-- ローディング -->
  <div class="loading-screen" id="loadingScreen">
    <canvas id="loadingCanvas" width="200" height="200" aria-label="生成中のアニメーション"></canvas>
    <p class="loading-phase-label" id="loadingPhaseLabel"></p>
    <p class="loading-words" id="loadingWords">観測中</p>
  </div>

  <!-- 結果画面 -->
  <div class="result-screen" id="resultScreen">
    <div class="result-divider"></div>
    <div id="resultContent"></div>
    <div style="margin-top:48px;">
      <button class="btn-secondary" onclick="resetToInput()" style="width:100%;">もう一度観測する</button>
    </div>
  </div>

  <!-- フッター -->
  <footer class="site-footer">
    <p>
      NAMI ENSO ENGINE v1.6.1<br>
      世界は線でできている。円は揺れる線の軌跡。<br>
      <a href="https://note.com/nami_enso" target="_blank">小説「波円相」を読む</a>
    </p>
  </footer>

</div>

<script>
// ═══════════════════════════════════════════════
// LOADING ANIMATION ENGINE
// ═══════════════════════════════════════════════

const PHASE_COLORS = {
  '天地人': { stroke: '#1a3a5c', glow: '#7a8fa3', label: '天地人' },
  '蒼穹':   { stroke: '#2a6aad', glow: '#a8d4f5', label: '蒼穹' },
  '大潮':   { stroke: '#1a5c7a', glow: '#4ab8d4', label: '大潮' },
  '嵐の海': { stroke: '#0a1628', glow: '#3a6a9a', label: '嵐の海' },
  'ZENp':   { stroke: '#7a8fa3', glow: '#c8d8e8', label: 'mode:ZENp（possibility）' },
};

let animFrameId = null;
let animStartTime = null;

// ── 暫定フェーズ推定 ──────────────────────────────
function estimatePhase() {
  const event   = (document.getElementById('event').value || '').toLowerCase();
  const mood    = (document.getElementById('mood').value || '').toLowerCase();
  const theme   = (document.getElementById('theme').value || '').toLowerCase();
  const isZenp  = !document.getElementById('event').value.trim() &&
                  !document.getElementById('mood').value.trim();

  if (isZenp) return 'ZENp';

  const text = event + ' ' + mood + ' ' + theme;

  // 自然データ
  const tide    = document.getElementById('tide').value;
  const weather = document.getElementById('weather').value.trim().toLowerCase();
  const temp    = parseFloat(document.getElementById('temperature').value) || 20;
  const wind    = parseFloat(document.getElementById('windspeed').value) || 0;

  // 簡易USHIO計算
  let ushio = { '大潮':90,'中潮':55,'小潮':20,'長潮':20,'若潮':35 }[tide] || 40;
  if (/荒天|嵐|storm/.test(weather) || wind >= 10) ushio += 20;
  if (/穏|calm|凪/.test(weather)) ushio -= 10;

  // 簡易GYOUN計算（キーワード加算方式、ベース30）
  let gyoun = 30;
  if (/快/.test(weather))          gyoun += 10;
  if (/晴/.test(weather))          gyoun -= 5;
  if (/曇/.test(weather))          gyoun += 5;
  if (/雨/.test(weather))          gyoun += 10;
  if (/雷|嵐|荒天/.test(weather))  gyoun += 20;
  if (/台風/.test(weather))        gyoun += 30;
  if (/雹/.test(weather))          gyoun += 15;
  if (/竜巻/.test(weather))        gyoun += 25;
  if (wind === 0) gyoun -= 10;
  gyoun += wind * 2;
  if (temp >= 35 || temp <= 5) gyoun += 15;

  // テキストキーワード補正
  const highNoise  = /焦|不安|混乱|乱れ|ざわ|ストレス|tired|anxiety|chaos|忙|疲/.test(text);
  const highFlow   = /ひらめき|流れ|スムーズ|楽し|嬉し|快|気持ちい|flow|happy/.test(text);
  const highClear  = /穏やか|静か|落ち着|すっきり|整|calm|clear|平和/.test(text);

  if (highNoise && !highClear) { ushio += 15; gyoun += 10; }
  if (highFlow)                { ushio += 10; }
  if (highClear)               { ushio -= 10; gyoun -= 10; }

  // フェーズ判定
  if (ushio >= 65 && gyoun >= 65) return '嵐の海';
  if (ushio >= 65 && gyoun <  65) return '大潮';
  if (ushio <  65 && gyoun >= 65) return '蒼穹';
  return '天地人';
}

// ── Canvas アニメーション本体 ──────────────────────
function startCanvasAnimation(phase) {
  const canvas = document.getElementById('loadingCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W / 2, cy = H / 2;
  const R = 72;
  const color = PHASE_COLORS[phase] || PHASE_COLORS['天地人'];

  // フェーズラベル表示
  const label = document.getElementById('loadingPhaseLabel');
  if (label) label.textContent = color.label;

  if (animFrameId) cancelAnimationFrame(animFrameId);
  animStartTime = null;

  const drawers = {
    '天地人': drawTenchijin,
    '蒼穹':   drawSoukyu,
    '大潮':   drawOoshio,
    '嵐の海': drawArashi,
    'ZENp':   drawZenp,
  };
  const draw = drawers[phase] || drawTenchijin;

  function loop(ts) {
    if (!animStartTime) animStartTime = ts;
    const t = (ts - animStartTime) / 1000; // 経過秒
    ctx.clearRect(0, 0, W, H);
    draw(ctx, cx, cy, R, t, color);
    animFrameId = requestAnimationFrame(loop);
  }
  animFrameId = requestAnimationFrame(loop);
}

function stopCanvasAnimation() {
  if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }
}

// ── 天地人：墨が一筆書きで円をゆっくり閉じる ──
function drawTenchijin(ctx, cx, cy, R, t, color) {
  const DURATION = 3.2;
  const progress = (t % DURATION) / DURATION;

  ctx.save();
  ctx.strokeStyle = color.stroke;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // 一筆書き円：0 → 約340°まで描いて隙間を残す
  const startAngle = -Math.PI / 2;
  const endAngle   = startAngle + progress * (Math.PI * 2 * 0.92);
  const lw = 4 + Math.sin(progress * Math.PI) * 3; // 筆圧変動
  ctx.lineWidth = lw;
  ctx.globalAlpha = 0.85;

  ctx.beginPath();
  ctx.arc(cx, cy, R, startAngle, endAngle);
  ctx.stroke();

  // 筆の先端：小さな滲み
  const ex = cx + R * Math.cos(endAngle);
  const ey = cy + R * Math.sin(endAngle);
  ctx.beginPath();
  ctx.arc(ex, ey, lw * 0.55, 0, Math.PI * 2);
  ctx.fillStyle = color.stroke;
  ctx.globalAlpha = 0.4;
  ctx.fill();

  ctx.restore();
}

// ── 蒼穹：光の粒子が円周に収束する ──
function drawSoukyu(ctx, cx, cy, R, t, color) {
  const PARTICLE_COUNT = 48;
  ctx.save();

  // 背景の薄い円ガイド
  ctx.strokeStyle = color.stroke;
  ctx.lineWidth = 1;
  ctx.globalAlpha = 0.1;
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.stroke();

  // 既に収束した弧
  const arcProgress = (Math.sin(t * 0.5) * 0.5 + 0.5); // 0→1→0 ゆっくり脈打つ
  ctx.strokeStyle = color.stroke;
  ctx.lineWidth = 2.5;
  ctx.globalAlpha = 0.5;
  ctx.beginPath();
  ctx.arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + arcProgress * Math.PI * 2);
  ctx.stroke();

  // 粒子
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const phase = (i / PARTICLE_COUNT) * Math.PI * 2;
    const speed = 0.4 + (i % 7) * 0.1;
    const orbit = t * speed + phase;

    // 収束率：外から円周に近づく動き
    const conv = (Math.sin(orbit * 0.3 + i) * 0.5 + 0.5);
    const dist  = R * (0.3 + conv * 0.75);
    const angle = phase + t * 0.25 * (i % 2 === 0 ? 1 : -1);

    const px = cx + dist * Math.cos(angle);
    const py = cy + dist * Math.sin(angle);
    const size = 0.8 + conv * 2.2;
    const alpha = 0.3 + conv * 0.65;

    ctx.beginPath();
    ctx.arc(px, py, size, 0, Math.PI * 2);
    ctx.fillStyle = color.glow;
    ctx.globalAlpha = alpha;
    ctx.fill();
  }

  ctx.restore();
}

// ── 大潮：波紋が渦を巻いて円を形成する ──
function drawOoshio(ctx, cx, cy, R, t, color) {
  ctx.save();

  // 背景の波紋リング
  for (let i = 0; i < 3; i++) {
    const rippleR = R * (0.4 + i * 0.28) + Math.sin(t * 1.2 + i * 1.2) * 8;
    ctx.beginPath();
    ctx.arc(cx, cy, rippleR, 0, Math.PI * 2);
    ctx.strokeStyle = color.glow;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.15 - i * 0.04;
    ctx.stroke();
  }

  // メイン：sin波で揺れながら円を形成
  ctx.beginPath();
  const STEPS = 120;
  for (let i = 0; i <= STEPS; i++) {
    const angle = (i / STEPS) * Math.PI * 2 - Math.PI / 2;
    const wave  = Math.sin(angle * 4 + t * 2.5) * 10 * Math.sin(t * 0.4);
    const r     = R + wave;
    const px    = cx + r * Math.cos(angle);
    const py    = cy + r * Math.sin(angle);
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.strokeStyle = color.stroke;
  ctx.lineWidth = 3;
  ctx.globalAlpha = 0.7;
  ctx.stroke();

  // 渦：中心から放射する短い線
  for (let i = 0; i < 8; i++) {
    const angle = (i / 8) * Math.PI * 2 + t * 0.8;
    const r0 = R * 0.15, r1 = R * 0.4;
    ctx.beginPath();
    ctx.moveTo(cx + r0 * Math.cos(angle), cy + r0 * Math.sin(angle));
    ctx.lineTo(cx + r1 * Math.cos(angle), cy + r1 * Math.sin(angle));
    ctx.strokeStyle = color.glow;
    ctx.lineWidth = 1.5;
    ctx.globalAlpha = 0.25;
    ctx.stroke();
  }

  ctx.restore();
}

// ── 嵐の海：乱れた線が円に収束する ──
function drawArashi(ctx, cx, cy, R, t, color) {
  ctx.save();

  // 背景の円（薄く）
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.strokeStyle = color.stroke;
  ctx.lineWidth = 1;
  ctx.globalAlpha = 0.15;
  ctx.stroke();

  // 乱れた線が収束する：複数のブラシストローク
  const LINES = 18;
  for (let i = 0; i < LINES; i++) {
    const baseAngle = (i / LINES) * Math.PI * 2;
    const chaos = Math.sin(t * 1.8 + i * 1.3) * 30;
    const r1 = R * (1.8 + Math.sin(t * 2.2 + i) * 0.5);
    const r2 = R * (0.92 + Math.sin(t * 1.5 + i * 0.7) * 0.08);

    const sx = cx + r1 * Math.cos(baseAngle + chaos * 0.015);
    const sy = cy + r1 * Math.sin(baseAngle + chaos * 0.015);
    const ex = cx + r2 * Math.cos(baseAngle);
    const ey = cy + r2 * Math.sin(baseAngle);
    // 制御点：乱れ
    const cpx = cx + (r1 * 0.6) * Math.cos(baseAngle + 0.3 * Math.sin(t + i));
    const cpy = cy + (r1 * 0.6) * Math.sin(baseAngle + 0.3 * Math.sin(t + i));

    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.quadraticCurveTo(cpx, cpy, ex, ey);
    ctx.strokeStyle = color.stroke;
    ctx.lineWidth = 1 + Math.abs(Math.sin(t + i)) * 1.5;
    ctx.globalAlpha = 0.25 + Math.abs(Math.sin(t * 0.7 + i)) * 0.35;
    ctx.stroke();
  }

  // 収束した円のアーク（断片的に）
  for (let seg = 0; seg < 6; seg++) {
    const start = (seg / 6) * Math.PI * 2 - Math.PI / 2 + t * 0.3;
    const span  = Math.PI / 3 * (0.4 + Math.sin(t * 1.1 + seg) * 0.3);
    ctx.beginPath();
    ctx.arc(cx, cy, R, start, start + span);
    ctx.strokeStyle = color.stroke;
    ctx.lineWidth = 3.5;
    ctx.globalAlpha = 0.55;
    ctx.stroke();
  }

  ctx.restore();
}

// ── ZENp：一本の線がゆっくり伸び、閉じ切らずに呼吸する・全体回転 ──
function drawZenp(ctx, cx, cy, R, t, color) {
  ctx.save();

  // 全体を1周20秒でゆっくり回転
  const rotation = (t / 20) * Math.PI * 2;
  ctx.translate(cx, cy);
  ctx.rotate(rotation);
  ctx.translate(-cx, -cy);

  // 息遣い：わずかに開いた円
  const openAngle = 0.25 + Math.sin(t * 0.7) * 0.12;
  const startA = -Math.PI / 2 + openAngle / 2;
  const endA   = startA + Math.PI * 2 - openAngle;

  const breathR = R + Math.sin(t * 0.9) * 3;

  ctx.beginPath();
  ctx.arc(cx, cy, breathR, startA, endA);
  ctx.strokeStyle = color.stroke;
  ctx.lineWidth = 2.8 + Math.sin(t * 0.6) * 0.8;
  ctx.globalAlpha = 0.45 + Math.sin(t * 0.9) * 0.15;
  ctx.stroke();

  // 線端：微かな揺れ
  const tipA1 = startA;
  const tipA2 = endA;
  [tipA1, tipA2].forEach(angle => {
    const tx = cx + breathR * Math.cos(angle);
    const ty = cy + breathR * Math.sin(angle);
    ctx.beginPath();
    ctx.arc(tx, ty, 2 + Math.sin(t * 1.1) * 0.8, 0, Math.PI * 2);
    ctx.fillStyle = color.stroke;
    ctx.globalAlpha = 0.3;
    ctx.fill();
  });

  // 中心の微かな点
  ctx.beginPath();
  ctx.arc(cx, cy, 2 + Math.sin(t * 1.5) * 1.2, 0, Math.PI * 2);
  ctx.fillStyle = color.glow;
  ctx.globalAlpha = 0.2 + Math.sin(t * 1.5) * 0.15;
  ctx.fill();

  ctx.restore();
}

// ── 正規分布乱数（Box-Muller法）──────────────────
function randNormal(mean, sd) {
  let u, v;
  do { u = Math.random(); } while (u === 0);
  do { v = Math.random(); } while (v === 0);
  const n = Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  return Math.min(100, Math.max(0, Math.round(mean + sd * n)));
}

      '今日あったこと：' + (event || '（未入力）') + '\n' +
      '今の気分：' + (mood || '（未入力）') + '\n' +
      '頭の中のテーマ：' + (theme || '（なし）');
  }

  document.getElementById('observeBtn').disabled = true;
  document.getElementById('errorMsg').classList.remove('show');
  document.getElementById('inputZone').style.display = 'none';

  // 暫定フェーズ推定 → Canvasアニメ開始
  const estimatedPhase = estimatePhase();
  const loadingScreen = document.getElementById('loadingScreen');
  loadingScreen.classList.remove('fade-out');
  loadingScreen.classList.add('show');
  startCanvasAnimation(estimatedPhase);
  startLoadingWords(isZenp);

  try {
    const keyRes = await fetch('/api/key');
    const keyData = await keyRes.json();
    const apiKey = keyData.key;

    const response = await fetch(
      'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + apiKey,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ role: 'user', parts: [{ text: SYSTEM_PROMPT + '\n\n' + userInput }] }],
          generationConfig: { temperature: 0.8, maxOutputTokens: 8192 }
        })
      }
    );

    if (!response.ok) throw new Error('Gemini API error: ' + response.status);

    const data = await response.json();
    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
    if (!text) throw new Error('応答が空でした');

    const stripped = text.replace(/```json/g, '').replace(/```/g, '').trim();
    const jsonMatch = stripped.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error('JSONが見つかりませんでした');
    const parsed = JSON.parse(jsonMatch[0]);

    currentResult = parsed;

    if (!isZenp) {
      // デバッグ情報収集
      const debug = {
        raw_zen_x: parsed.zen_x,
        raw_zen_y: parsed.zen_y,
        raw_params: { ...parsed.params },
        phase_override: null,
      };

      // ③ 仮ZEN5指標を仮zen_y・zen_xで補正 → 本当のZEN5指標
      const WEIGHT = 20;
      const depthFactor = (parsed.zen_y || 0) / 100;
      const pathFactor  = (parsed.zen_x || 0) / 100;
      const p = parsed.params;

      const clamp = v => Math.min(100, Math.max(0, Math.round(v)));
      p.clarity           = clamp(p.clarity           + depthFactor * WEIGHT);
      p.flow              = clamp(p.flow              + depthFactor * WEIGHT);
      p.circle_completion = clamp(p.circle_completion + depthFactor * WEIGHT + pathFactor * WEIGHT);
      p.noise             = clamp(p.noise             + pathFactor  * WEIGHT);
      p.tension           = clamp(p.tension           + pathFactor  * WEIGHT);

      // ④ 本当のdepth・pathを算出（zen_y・zen_xを30%ブレンド）
      const noiseInv = 100 - p.noise; // noise高=人間的=depth-なので反転
      const rawDepth = ((p.clarity + noiseInv + p.circle_completion) / 3 - 50) * 2;
      const rawPath  = ((p.flow + p.tension + p.circle_completion) / 3 - 50) * 2;
      const depth = rawDepth * 0.7 + (parsed.zen_y || 0) * 0.3;
      const path  = rawPath  * 0.7 + (parsed.zen_x || 0) * 0.3;
      parsed.zen_depth = Math.round(depth);
      parsed.zen_path  = Math.round(path);

      debug.final_params = { ...p };
      debug.final_depth  = parsed.zen_depth;
      debug.final_path   = parsed.zen_path;

      // ⑤ フェーズ上書き（両軸±70超のみ）
      const originalPhase = parsed.phase;
      let overrideLabel = null;
      if      (path < -70 && depth < -70) { parsed.phase = '天地人（静謐）'; overrideLabel = '打坐極端'; }
      else if (path < -70 && depth >  70) { parsed.phase = '天地人（通常）'; overrideLabel = '凪極端'; }
      else if (path >  70 && depth >  70) { parsed.phase = '大潮';           overrideLabel = '回遊極端'; }
      else if (path >  70 && depth < -70) { parsed.phase = '嵐の海';         overrideLabel = '発起極端'; }

      debug.phase_override = overrideLabel
        ? `${originalPhase} → ${parsed.phase}（ZEN do極端値による上書き：${overrideLabel}）`
        : `上書きなし（${originalPhase}）`;

      parsed._debug = debug;

      // ⑥ 画像プロンプト動的調整
      const adjustments = [];

      if (p.clarity >= 70)           adjustments.push("smooth luminous ink, clear water reflection");
      if (p.clarity <= 30)           adjustments.push("blurred misty stroke, murky tidal depths");
      if (p.noise >= 70)             adjustments.push("scattered ink fragments, chaotic sea texture, turbulent grain");
      if (p.tension >= 70)           adjustments.push("sharp angular stroke, high contrast, taut wave lines");
      if (p.flow >= 70)              adjustments.push("fluid wave-like curves, tidal current movement, ink flowing like water");
      if (p.circle_completion <= 30) adjustments.push("incomplete open circle, wave breaking the seal, asymmetric composition");

      if (depth >= 30)       adjustments.push("abundant white sea spray particles, luminous mist, ocean breath, blue tones");
      else if (depth <= -30) adjustments.push("dense sumi ink texture, washi paper grain, meditative brushwork, ink black tones");

      if (path >= 30)        adjustments.push("bold thick brushstroke, intense dark ink, chaotic fraying edges, turbulent movement");
      else if (path <= -30)  adjustments.push("delicate thin brushstroke, pale ink wash, smooth settled stroke, quiet stillness");

      if (adjustments.length > 0) {
        parsed.image_prompt = parsed.image_prompt.replace(
          'no text, no border, no signature, no frame, washi paper background, high resolution',
          adjustments.join(', ') + ', no text, no border, no signature, no frame, washi paper background, high resolution'
        );
      }
    }

    // ZENp：JS生成のランダム値でパラメータ・フェーズを確定上書き
    if (isZenp && zenpPreset) {
      parsed.phase        = zenpPreset.phase;
      parsed.ushio        = zenpPreset.ushio;
      parsed.gyoun        = zenpPreset.gyoun;
      parsed.params       = zenpPreset.params;
      parsed.image_prompt = zenpPreset.imagePrompt;
      parsed.zen0         = false;
    }

    stopLoadingWords();
    stopCanvasAnimation();

    // フェードアウト → 結果表示
    loadingScreen.classList.add('fade-out');
    setTimeout(() => {
      loadingScreen.classList.remove('show');
      loadingScreen.classList.remove('fade-out');
      renderResult(parsed, isZenp);
    }, 800);

  } catch (err) {
    stopLoadingWords();
    stopCanvasAnimation();
    loadingScreen.classList.add('fade-out');
    setTimeout(() => {
      loadingScreen.classList.remove('show');
      loadingScreen.classList.remove('fade-out');
      document.getElementById('inputZone').style.display = 'block';
      document.getElementById('observeBtn').disabled = false;
      showError('観測中にエラーが発生しました。もう一度お試しください。');
    }, 800);
    console.error(err);
  }
}

function renderResult(result, isZenp = false) {
  const container = document.getElementById('resultContent');

  if (result.zen0) {
    container.innerHTML = '<div class="zen0-display">' + result.log.replace(/\n/g, '<br>') + '</div>';
  } else {
    const shareText = `今日の波円相を観測しました。\n\nフェーズ：${result.phase}\n${result.log}\n\n#波円相 #NAMIENSO\nhttps://namienso.vercel.app`;

    const zenDoHtml = (!isZenp && result.zen_depth !== undefined) ? `
      <p style="font-size:10px;letter-spacing:0.25em;color:var(--mist);margin-top:6px;">
        ZEN Do &nbsp;&nbsp;
        depth: ${result.zen_depth > 0 ? '+' : ''}${result.zen_depth}
        &nbsp;·&nbsp;
        path: ${result.zen_path > 0 ? '+' : ''}${result.zen_path}
      </p>` : '';

    container.innerHTML = `
      <div class="enso-display" id="ensoDisplay">
        <div class="generating-placeholder" id="imgPlaceholder">円を生成中 ──────</div>
        <img id="generatedImg" alt="今日の波円相" />
      </div>

      <div class="phase-badge">
        <span class="phase-name">${isZenp ? 'mode:ZENp（possibility）' : result.phase}</span>
        <p style="font-size:10px;letter-spacing:0.2em;color:var(--mist);margin-top:10px;">
          USHIO ${result.ushio} &nbsp;·&nbsp; GYOUN ${result.gyoun}
        </p>
        ${zenDoHtml}
      </div>

      <p class="obs-log">${result.log}</p>

      <div class="result-body">${result.body}</div>

      <div class="actions">
        <button class="btn-primary" id="saveBtn" onclick="saveImage()">円をダウンロード</button>
        <div class="btn-row">
          <button class="btn-secondary" onclick="toggleShare()">Xでシェアする</button>
          <button class="btn-secondary" onclick="openNote()">小説を読む</button>
        </div>
        <div class="share-text-area" id="shareArea">${shareText}</div>
        <button class="btn-secondary" id="sharePostBtn" onclick="postToX()" style="display:none;">このテキストでポストする</button>
      </div>

      <div class="prompt-detail">
        <button class="prompt-toggle" onclick="togglePrompt()">IMAGE PROMPT を表示</button>
        <div class="prompt-content" id="promptContent">${result.image_prompt}</div>
      </div>

      ${result._debug ? `
      <div class="prompt-detail" style="margin-top:8px;border-color:#c8a0a0;">
        <button class="prompt-toggle" style="color:#a06060;" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='block'?'none':'block'">DEBUG PANEL を表示</button>
        <div class="prompt-content" style="display:none;font-size:10px;line-height:1.8;letter-spacing:0.05em;">
<b>【仮値（Gemini出力）】</b>
zen_x (path): ${result._debug.raw_zen_x}　zen_y (depth): ${result._debug.raw_zen_y}
clarity: ${result._debug.raw_params.clarity}　noise: ${result._debug.raw_params.noise}　tension: ${result._debug.raw_params.tension}　flow: ${result._debug.raw_params.flow}　circle_completion: ${result._debug.raw_params.circle_completion}

<b>【補正後（最終値）】</b>
depth: ${result._debug.final_depth > 0 ? '+' : ''}${result._debug.final_depth}　path: ${result._debug.final_path > 0 ? '+' : ''}${result._debug.final_path}
clarity: ${result._debug.final_params.clarity}　noise: ${result._debug.final_params.noise}　tension: ${result._debug.final_params.tension}　flow: ${result._debug.final_params.flow}　circle_completion: ${result._debug.final_params.circle_completion}

<b>【フェーズ判定】</b>
${result._debug.phase_override}
        </div>
      </div>` : ''}
    `;
  }

  document.getElementById('resultScreen').classList.add('show');
  document.getElementById('resultScreen').scrollIntoView({ behavior: 'smooth', block: 'start' });

  if (!result.zen0) {
    generateImage(result.image_prompt);
  }
}

async function generateImage(prompt) {
  const placeholder = document.getElementById('imgPlaceholder');
  const img = document.getElementById('generatedImg');

  try {
    const res = await fetch('/api/image', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: prompt })
    });

    if (!res.ok) throw new Error('image API error: ' + res.status);
    const data = await res.json();

    if (data.b64) {
      const src = 'data:image/png;base64,' + data.b64;
      img.onload = () => {
        img.classList.add('loaded');
        if (placeholder) placeholder.style.display = 'none';
      };
      img.src = src;
    } else {
      if (placeholder) placeholder.textContent = '画像生成に失敗しました';
    }
  } catch (err) {
    console.error('Image gen error:', err);
    if (placeholder) placeholder.textContent = '画像生成に失敗しました';
  }
}function saveImage() {
  const img = document.getElementById('generatedImg');
  if (!img || !img.src || img.src === window.location.href) {
    alert('画像がまだ生成されていません');
    return;
  }
  const a = document.createElement('a');
  a.href = img.src;
  a.download = 'namienso_' + new Date().toISOString().slice(0,10) + '.png';
  a.click();
}

function toggleShare() {
  const area = document.getElementById('shareArea');
  const btn = document.getElementById('sharePostBtn');
  const isShow = area.style.display === 'block';
  area.style.display = isShow ? 'none' : 'block';
  btn.style.display = isShow ? 'none' : 'block';
}

function postToX() {
  const text = document.getElementById('shareArea').textContent;
  window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(text), '_blank');
}

function openNote() {
  window.open('https://note.com/nami_enso', '_blank');
}

function togglePrompt() {
  const el = document.getElementById('promptContent');
  el.style.display = el.style.display === 'block' ? 'none' : 'block';
}

function resetToInput() {
  document.getElementById('resultScreen').classList.remove('show');
  document.getElementById('resultScreen').style.display = 'none';
  document.getElementById('resultContent').innerHTML = '';
  document.getElementById('inputZone').style.display = 'block';
  document.getElementById('observeBtn').disabled = false;
  currentResult = null;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  setTimeout(() => {
    document.getElementById('resultScreen').style.display = '';
  }, 600);
}

function clearAll() {
  ['event','mood','theme','date','weather','temperature','windspeed'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('tide').value = '';
  document.getElementById('errorMsg').classList.remove('show');
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('show');
}
</script>
